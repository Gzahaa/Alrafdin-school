        <h1>طلب التسجيل المبدئي</h1>
        <p>يرجى تعبئة النموذج التالي لتسجيل الطالب للموسم الدراسي القادم:</p>
        <br>
        <form onsubmit="alert('تم إرسال الطلب بنجاح!'); return false;">
            <div class="form-group">
                <label>اسم الطالب الثلاثي:</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>المرحلة الدراسية:</label>
                <select required>
                    <option value="">اختر المرحلة</option>
                    <option>الابتدائية</option>
                    <option>المتوسطة</option>
                    <option>الثانوية</option>
                </select>
            </div>
            <div class="form-group">
                <label>رقم هاتف ولي الأمر:</label>
                <input type="tel" required>
            </div>
            <button type="submit" class="btn">إرسال الطلب</button>
        </form>
